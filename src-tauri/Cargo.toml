[package]
name = "apidock"
version = "0.1.0"
description = "A pure offline API management tool"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apidock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
uuid = { version = "1.26", features = ["v4"] }
dirs = "6"
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "gzip", "multipart", "query", "system-proxy", "cookies"] }
serde_urlencoded = "0.7"
mime_guess = "2.0"
tokio = { version = "1.53", features = ["fs"] }
regex-lite = "0.1"
serde_yaml_ng = "0.10"
openapiv3 = "2"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
